version: '3.8'

services:
  hse-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hse-system
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Map the local data directory to the container's data directory
      # This ensures the SQLite database persists across container restarts
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # - NEXT_PUBLIC_API_URL=http://your-domain.com
